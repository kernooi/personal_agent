# Private %LOCALAPPDATA%/Jarvis/voice.toml. Local wake listening in the ready GUI.
version = 1
enabled = true
interaction_mode = "wake_word"
wake_enabled = true
wake_call = "Jarvis" # Change in GUI Settings > Wake call. One to five spoken words.
wake_provider = "windows_sapi" # Installed offline Windows grammar; no Whisper sentence wait.
wake_session_seconds = 60
wake_followup_seconds = 10 # Command listening window after “Yes sir” finishes (3–20).
wake_silence_seconds = 1.1
# Audio activity threshold, not model confidence: lower hears softer speech.
wake_minimum_rms = 100
stt_provider = "faster-whisper"
# Relative to private Jarvis root; installed local converted Whisper assets only.
model_directory = "speech/base.en"
stt_beam_size = 5 # Bounded recognition search; no previous-chat conditioning.
app_name_hints = false # Experimental: app hints can bias ordinary words into app names.
recognition_terms = [] # Optional names, e.g. a personal playlist's exact spelling.
language = "en"
input_device = ""
recording_seconds = 20
transcription_seconds = 45
# Used only by explicit push_to_talk lab mode; wake mode uses wake_silence_seconds.
silence_seconds = 0.0
speak_responses = true # The GUI always enables spoken replies; no UI toggle.
tts_provider = "windows_sapi" # Explicitly choose "kokoro" after approved neural-voice setup.
tts_model_directory = "speech/kokoro-v1.0"
neural_voice = "am_michael" # American male; "bm_george" is British male.
voice = ""
output_device = ""
volume = 80
rate = 0
speech_seconds = 90
review_transcript = false
