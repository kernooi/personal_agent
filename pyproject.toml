[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-simulated-core"
version = "0.1.0"
description = "Local text assistant with safe simulated execution"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10,<3", "httpx==0.28.1", "httpcore==1.0.9", "tzdata>=2026.1", "pypdf>=6,<7"]

[project.optional-dependencies]
voice = ["sounddevice>=0.5,<0.6", "faster-whisper>=1.2.1,<2", "numpy>=2.2,<3"]
neural-voice = ["kokoro-onnx==0.6.1"]
windows = ["comtypes>=1.4.8,<2; sys_platform == 'win32'"]
browser = ["playwright>=1.55,<2"]
media = ["winrt-Windows.Media.Control==3.2.1; sys_platform == 'win32'", "winrt-Windows.Media==3.2.1; sys_platform == 'win32'", "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'", "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'", "winrt-Windows.System==3.2.1; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pip-tools>=7.4,<8", "setuptools>=75"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["data/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
